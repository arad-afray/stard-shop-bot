# Alembic: مهاجرت‌های پایگاه داده. ربات هنگام شروع خودکار upgrade می‌کند.
# اجرای دستی:  alembic upgrade head   |   alembic current   |   alembic history
# آدرس پایگاه داده از DATABASE_URL یا DATABASE_PATH در .env خوانده می‌شود (نه از این فایل).
[alembic]
script_location = bot/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
