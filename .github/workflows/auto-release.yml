# انتشار خودکار: هر بار کدی با شماره‌ی نسخه‌ی جدید (bot/__init__.py) پوش شود، تست‌ها اجرا و Release رسمی
# با فایل zip و SHA256SUMS منتشر می‌شود. ربات‌های نصب‌شده آن را در پنل ← 🛠 سیستم ← 🔄 به‌روزرسانی می‌بینند
# و با یک دکمه نصب می‌کنند. اگر نسخه عوض نشده باشد (تگش از قبل هست) کاری انجام نمی‌شود.
name: auto-release
on:
  push:
    branches: [main, "claude/starship-bot-github-access-qggts8"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auto-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Read version
        id: v
        run: |
          V=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('bot/__init__.py').read()).group(1))")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "v$V already released — nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "v$V is new — releasing"
          fi
      - if: steps.v.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - if: steps.v.outputs.exists == 'false'
        name: Tests
        run: pip install -r requirements-dev.txt && pytest -q
      - if: steps.v.outputs.exists == 'false'
        name: Build release archive
        run: |
          NAME=stard-shop-bot-v${{ steps.v.outputs.version }}
          git archive --format=zip --prefix=${NAME}/ -o ${NAME}.zip HEAD
          sha256sum ${NAME}.zip > SHA256SUMS
      - if: steps.v.outputs.exists == 'false'
        name: Changelog for this version
        run: |
          V=${{ steps.v.outputs.version }}
          awk "/^## ${V//./\\.}/{f=1;next} /^## /{f=0} f" CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release v$V" > notes.md
      - if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.v.outputs.version }}
          body_path: notes.md
          make_latest: "true"
          files: |
            stard-shop-bot-v${{ steps.v.outputs.version }}.zip
            SHA256SUMS
